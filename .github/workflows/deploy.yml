# Publishes public/ to the Cloudflare Pages project "deltav-web".
# Production is https://deltav-web.pages.dev once the secrets below exist.
#
# One-time setup, in the GitHub repo under Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   API token with the "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  Account ID from the Workers & Pages overview
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "This deploy needs two GitHub Actions secrets:"
            echo "  CLOUDFLARE_API_TOKEN   (permission: Cloudflare Pages — Edit)"
            echo "  CLOUDFLARE_ACCOUNT_ID  (Workers & Pages overview)"
            exit 1
          fi

      - name: Create the Pages project if needed
        id: create
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages project create deltav-web --production-branch main

      - name: Prepare the leads database
        id: leads
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/ensure-leads-db.sh

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=deltav-web --branch=main --commit-hash=${{ github.sha }}

      - name: Attach deltav.info
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          brief() { jq '{success, errors: [.errors[]? | {code, message}]}'; }

          projects=$(curl -sS "${auth[@]}" "$base/pages/projects")
          echo "Pages projects:"
          echo "$projects" | jq '{success, errors: [.errors[]? | {code, message}], names: [.result[]?.name]}'
          if ! echo "$projects" | jq -e '.success == true' >/dev/null; then
            echo "Could not list Pages projects; continuing with an empty list"
            projects='{"success":true,"result":[]}'
          fi

          owner=""
          while read -r project; do
            [ -n "$project" ] || continue
            domains=$(curl -sS "${auth[@]}" "$base/pages/projects/${project}/domains")
            echo "Domains on ${project}:"
            echo "$domains" | jq '{success, errors: [.errors[]? | {code, message}], domains: [.result[]? | {name, status}]}'
            if echo "$domains" | jq -e '.result[]? | select(.name == "deltav.info")' >/dev/null; then
              owner=$project
            fi
          done < <(echo "$projects" | jq -r '.result[]?.name')

          if [ "$owner" = "deltav-web" ]; then
            echo "deltav.info is already attached to deltav-web"
            exit 0
          fi

          if [ -n "$owner" ]; then
            echo "Moving deltav.info from Pages project ${owner} to deltav-web"
            removed=$(curl -sS -X DELETE "${auth[@]}" "$base/pages/projects/${owner}/domains/deltav.info")
            echo "$removed" | brief
            echo "$removed" | jq -e '.success == true' >/dev/null
          else
            echo "deltav.info is not on a Pages project this token can see"
            workers=$(curl -sS "${auth[@]}" "$base/workers/domains")
            echo "Workers custom domains:"
            echo "$workers" | jq '{success, errors: [.errors[]? | {code, message}], domains: [.result[]? | {id, hostname, service, environment}]}'
            domain_id=$(echo "$workers" | jq -r '.result[]? | select(.hostname == "deltav.info") | .id' | head -n 1)
            if [ -n "$domain_id" ]; then
              echo "Removing Workers custom domain ${domain_id}"
              removed=$(curl -sS -X DELETE "${auth[@]}" "$base/workers/domains/${domain_id}")
              echo "$removed" | brief
              echo "$removed" | jq -e '.success == true' >/dev/null
            fi
          fi

          response=$(curl -sS -X POST "${auth[@]}" "$base/pages/projects/deltav-web/domains" --data '{"name":"deltav.info"}')
          echo "$response" | jq '{success, errors: [.errors[]? | {code, message}], name: .result.name, status: .result.status, verification: .result.verification_data.status, validation: .result.validation_data.status, validation_error: .result.validation_data.error_message}'
          if echo "$response" | jq -e '.success == true or (.errors[]? | .code == 8000018)' >/dev/null; then
            exit 0
          fi
          exit 1

      - name: Point deltav.info DNS at Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          api="https://api.cloudflare.com/client/v4"
          target="deltav-web.pages.dev"
          domain=$(curl -sS "${auth[@]}" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/deltav-web/domains/deltav.info")
          echo "Pages domain:"
          echo "$domain" | jq '{success, errors: [.errors[]? | {code, message}], status: .result.status, verification: .result.verification_data.status, verification_error: .result.verification_data.error_message, validation: .result.validation_data.status, validation_error: .result.validation_data.error_message}'

          zone=$(curl -sS "${auth[@]}" "$api/zones?name=deltav.info")
          echo "Zone:"
          echo "$zone" | jq '{success, errors: [.errors[]? | {code, message}], zones: [.result[]? | {id, name, status}]}'
          zid=$(echo "$zone" | jq -r '.result[0].id // empty')
          if [ -z "$zid" ]; then
            echo "This token cannot read the deltav.info zone, so DNS was not changed."
            exit 1
          fi
          recs=$(curl -sS "${auth[@]}" "$api/zones/${zid}/dns_records?per_page=100")
          echo "Current apex and www records:"
          echo "$recs" | jq '{success, errors: [.errors[]? | {code, message}], records: [.result[]? | select(.name == "deltav.info" or .name == "www.deltav.info") | {id, type, name, content, proxied}]}'
          echo "$recs" | jq -e '.success == true' >/dev/null

          echo "$recs" | jq -r --arg t "$target" '.result[]? | select(.name == "deltav.info" and (.type == "A" or .type == "AAAA" or (.type == "CNAME" and .content != $t))) | .id' | while read -r id; do
            [ -n "$id" ] || continue
            echo "Removing conflicting apex record ${id}"
            deleted=$(curl -sS -X DELETE "${auth[@]}" "$api/zones/${zid}/dns_records/${id}")
            echo "$deleted" | jq '{success, errors: [.errors[]? | {code, message}]}'
            echo "$deleted" | jq -e '.success == true' >/dev/null
          done

          recs=$(curl -sS "${auth[@]}" "$api/zones/${zid}/dns_records?name=deltav.info")
          has=$(echo "$recs" | jq -r --arg t "$target" '[.result[]? | select(.type == "CNAME" and .content == $t and .proxied == true)] | length')
          if [ "$has" = "0" ]; then
            created=$(curl -sS -X POST "${auth[@]}" "$api/zones/${zid}/dns_records" --data "{\"type\":\"CNAME\",\"name\":\"deltav.info\",\"content\":\"${target}\",\"proxied\":true,\"ttl\":1}")
            echo "Created CNAME:"
            echo "$created" | jq '{success, errors: [.errors[]? | {code, message}], type: .result.type, name: .result.name, content: .result.content, proxied: .result.proxied}'
            echo "$created" | jq -e '.success == true' >/dev/null
          else
            echo "Proxied CNAME to ${target} is in place"
          fi

      - name: Leads database is required
        if: always() && steps.leads.outcome == 'failure'
        run: |
          echo "The site uploaded, but sign-ups are not being saved."
          echo "Add D1 Edit to CLOUDFLARE_API_TOKEN, then re-run this workflow."
          exit 1

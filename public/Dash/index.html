<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Delta-V Ops, Tracker, and Agenda</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#f7f7f8;--ink:#0c0c0c;--onink:#ffffff;--text:#2b2b2b;--text2:#4a4a4a;--mute:#6b6b6b;--line:#dededf;--line2:#e8e8ea;--pill:#c4c4c8;--acc:#2356F6}
@media(prefers-color-scheme:dark){:root{--bg:#000000;--card:#101012;--ink:#f2f2f2;--onink:#0c0c0c;--text:#d6d6d6;--text2:#b8b8b8;--mute:#8a8a8a;--line:#2e2e2e;--line2:#262626;--pill:#3a3a3a;--acc:#8CC3F2}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.mono{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
header{border-bottom:1px solid var(--line2);flex:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px;width:100%}
header .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-top:16px;padding-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{font:14px Arial,Helvetica,sans-serif;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--pill);background:transparent;color:var(--text);cursor:pointer}
nav button.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.open{font-size:14px;color:var(--acc);text-decoration:none;white-space:nowrap}.open:hover{text-decoration:underline}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.frame{flex:1 1 auto;margin:16px auto 24px;width:min(1400px,calc(100% - 48px));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);position:relative;min-height:560px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:14px;pointer-events:none}
@media(max-width:600px){.frame{width:calc(100% - 24px);margin:12px auto 16px;border-radius:10px}.wrap{padding:0 12px}}
</style>
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/"><svg width="22" height="22" viewBox="0 0 96 96" aria-hidden="true"><path d="M48 12 L86 82 L10 82 Z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"></path><line x1="28" y1="60" x2="68" y2="60" stroke="currentColor" stroke-width="8"></line></svg>DeltaV <span class="mono">Ops · Tracker · Agenda</span></a>
  <nav id="nav" aria-label="Sheet tabs">
    <button type="button" data-tab="Dashboard" class="on">Dashboard</button>
    <button type="button" data-tab="Tasks">Tasks</button>
    <button type="button" data-tab="Outreach">Outreach</button>
    <button type="button" data-tab="Resources">Resources</button>
    <button type="button" data-tab="Personas">Personas</button>
    <button type="button" data-tab="Messages">Messages</button>
  </nav>
  <div class="right"><span class="mono">Private · SK + Samyak</span><a class="open" id="openLink" href="https://docs.google.com/spreadsheets/d/1FF-0pW4Fav2RJtGVZUaYsiKcmi3X7naIpQ2p81IsjQs/edit" target="_blank" rel="noopener">Open in Google Sheets →</a></div>
</div></header>
<main>
  <div class="frame">
    <div class="note" id="note">Loading the sheet. If it stays blank, sign in to Google with the account SK shared it with.</div>
    <iframe id="sheet" title="Delta-V Ops Google Sheet" allow="clipboard-write" loading="eager"></iframe>
  </div>
</main>
<script>
{
  // The tab buttons switch the embedded sheet to a named tab. Fill GIDS from the sheet's
  // URL: open a tab in Google Sheets and copy the number after "#gid=". A tab with no gid
  // here still works: the sheet's own tab strip is visible at the bottom of the embed.
  const SHEET='1FF-0pW4Fav2RJtGVZUaYsiKcmi3X7naIpQ2p81IsjQs';
  const GIDS={Dashboard:'',Tasks:'',Outreach:'',Resources:'',Personas:'',Messages:''};
  const f=document.getElementById('sheet'),nav=document.getElementById('nav'),open=document.getElementById('openLink');
  const url=t=>`https://docs.google.com/spreadsheets/d/${SHEET}/edit?rm=minimal${GIDS[t]?'#gid='+GIDS[t]:''}`;
  function show(t){f.src=url(t);open.href=`https://docs.google.com/spreadsheets/d/${SHEET}/edit${GIDS[t]?'#gid='+GIDS[t]:''}`;for(const b of nav.querySelectorAll('button'))b.classList.toggle('on',b.dataset.tab===t);try{history.replaceState(null,'','#'+t.toLowerCase())}catch(e){}}
  nav.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)show(b.dataset.tab)});
  f.addEventListener('load',()=>{document.getElementById('note').style.display='none'});
  const h=(location.hash||'').slice(1).toLowerCase();const start=Object.keys(GIDS).find(k=>k.toLowerCase()===h)||'Dashboard';
  show(start);
}
</script>
</body>
</html>

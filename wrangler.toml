# Cloudflare Pages project. `pages_build_output_dir` is what marks this
# as a Pages project rather than a Worker.
name = "deltav-web"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-13"

# Design partner intake from /talk. Uncomment after
# `npx wrangler d1 create deltav_leads` and paste the id it prints.
# A placeholder id makes the Pages deploy reject the Function.
# [[d1_databases]]
# binding = "DB"
# database_name = "deltav_leads"
# database_id = ""
# migrations_dir = "migrations"

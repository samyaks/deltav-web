# Cloudflare Pages project. `pages_build_output_dir` is what marks this
# as a Pages project rather than a Worker.
name = "deltav-web"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-13"

# Design partner intake from /talk. Database created in the Cloudflare dashboard.
[[d1_databases]]
binding = "DB"
database_name = "deltav_leads"
database_id = "48ef27ff-b364-4c2b-8e09-cb58ff1a27cf"
migrations_dir = "migrations"

# Cloudflare Pages project. `pages_build_output_dir` is what marks this
# as a Pages project rather than a Worker.
name = "deltav-web"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-13"

# Design partner intake from /talk. Replace database_id with the id that
# `wrangler d1 create deltav_leads` prints.
[[d1_databases]]
binding = "DB"
database_name = "deltav_leads"
database_id = "REPLACE_WITH_THE_ID_FROM_WRANGLER_D1_CREATE"
migrations_dir = "migrations"
